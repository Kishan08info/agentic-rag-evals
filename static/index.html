<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic RAG Assistant — demo</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
  textarea { width: 100%; height: 4rem; font-size: 1rem; }
  button { font-size: 1rem; padding: .5rem 1.2rem; margin-top: .5rem; cursor: pointer; }
  #out { white-space: pre-wrap; background: #f6f6f6; padding: 1rem; border-radius: 8px; margin-top: 1rem; }
  .meta { color: #555; font-size: .85rem; margin-top: .5rem; }
</style>
</head>
<body>
<h2>Agentic RAG Assistant</h2>
<p>Ask anything about <em>Nimbus Analytics</em> (a fictional company). The agent retrieves from its local knowledge base, answers with citations, and says "I don't know" when the docs don't cover it.</p>
<textarea id="q" placeholder="e.g. How much does the Growth plan cost?"></textarea><br>
<button onclick="ask()">Ask</button>
<div id="out" hidden></div>
<script>
async function ask() {
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  const out = document.getElementById('out');
  out.hidden = false; out.textContent = 'Thinking…';
  const r = await fetch('/ask', {method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({question: q})});
  const j = await r.json();
  out.textContent = j.answer;
  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = `mode: ${j.mode} · abstained: ${j.abstained} · citations: ${j.citations.join(', ') || 'none'}`;
  out.appendChild(meta);
}
</script>
</body>
</html>
